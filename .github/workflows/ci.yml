name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (High+)
        run: npm audit --audit-level=high

      - name: Validate tokens
        run: npm run test:tokens

      - name: Build static documentation
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Check documentation and accessibility
        run: npm run test:browser
